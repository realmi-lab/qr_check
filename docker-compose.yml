services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: daouoffice
      POSTGRES_USER: roombot
      POSTGRES_PASSWORD: roombot
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      # 컨테이너를 처음 만들 때 스키마 → 시드 순서로 자동 실행
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db:/db:ro
