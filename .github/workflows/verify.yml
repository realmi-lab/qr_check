name: Verify clean install
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q
        env:
          PYTHON_DOTENV_DISABLED: '1'
